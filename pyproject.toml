[project]
name = "jarvis"
version = "0.1.0"
description = "Asisten suara AI offline, cross-platform"
requires-python = ">=3.11,<3.13"
dependencies = [
  "ollama>=0.4",
  "sounddevice>=0.4",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "platformdirs>=4.2",
  "loguru>=0.7",
  "onnxruntime>=1.17",
  "scipy>=1.11",
  "psutil>=5.9",
  "pystray>=0.19",
  "mss>=9.0",
  "pynput>=1.7",
  "pyperclip>=1.8",
  "Pillow>=10.0",
  "openwakeword>=0.6",
  "faster-whisper>=1.0",
  "piper-tts>=1.2",
  "pyttsx3>=2.90 ; sys_platform == 'win32'",
  "pycaw>=20240210 ; sys_platform == 'win32'",
  "comtypes>=1.2 ; sys_platform == 'win32'",
  "win11toast>=0.34 ; sys_platform == 'win32'",
  "fastapi>=0.162.2",
  "uvicorn>=0.30",
  "pypdf>=7.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "pyinstaller>=6.5"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: komponen audio/model besar, tidak wajib jalan di CI"]

[tool.uv]
# Mac Intel: onnxruntime terbaru tidak punya wheel x86_64 macOS; paksa uv memilih versi yang ada.
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]
