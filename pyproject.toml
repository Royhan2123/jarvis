[project]
name = "jarvis"
version = "0.1.0"
description = "Asisten suara AI offline, cross-platform"
requires-python = ">=3.11,<3.13"
dependencies = [
  "ollama>=0.4",
  "sounddevice>=0.4",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "platformdirs>=4.2",
  "loguru>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: komponen audio/model besar, tidak wajib jalan di CI"]
