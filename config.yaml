# Config default Jarvis (lihat docs/CONFIG.md untuk penjelasan tiap parameter).
# Fase 0: hanya bagian general, llm, router, tts, memory yang dipakai.
general:
  name: "Jarvis"
  user_title: "Bos"
  language: "id"
  log_level: "INFO"
  offline_only: false         # false karena suara Fish online; kembalikan true + engine piper untuk penuh offline

audio:
  input_device: null
  output_device: null
  sample_rate: 16000
  chunk_ms: 80
  sounds: true
  interruptible: true         # bisa dipotong dengan "berhenti" / kata pemanggil saat Jarvis bicara

wakeword:
  engine: "phrase"            # phrase = kenali frasa lewat Whisper | openwakeword = model hey_jarvis
  phrase: "hello"
  model: "hey_jarvis"
  threshold: 0.5
  cooldown_s: 2.0
  inference_framework: "onnx"

vad:
  threshold: 0.5
  silence_ms: 800
  max_record_s: 15
  listen_timeout_s: 8

stt:
  model: "small"              # untuk perintah. medium lebih akurat tapi ±2.5x lebih lambat di CPU
  wake_model: "base"         # untuk mengenali frasa pemanggil (cepat)
  device: "auto"
  compute_type: "int8"
  language: "auto"           # auto = kenali Indonesia/Inggris per ucapan (+0.4 dtk); "id" = Indonesia saja, tercepat
  beam_size: 1
  initial_prompt: "Hello, buka, tutup, volume, Spotify, Chrome, VS Code"
  cpu_threads: 6

llm:
  host: "http://localhost:11434"
  fast_model: "qwen3.5:4b"
  smart_model: "qwen3.5:9b"
  vision_model: "qwen3.5:4b"
  temperature: 0.3
  top_p: 0.8
  top_k: 20
  num_ctx: 2048
  num_predict: 100
  num_thread: 8
  keep_alive: -1
  think: false
  history_turns: 6

router:
  enable_rules: true
  enable_smart_model: true
  complex_min_words: 25
  complex_keywords: ["jelaskan", "analisis", "bandingkan", "kenapa", "mengapa", "buatkan", "rangkum"]
  preload_smart_model: false

tts:
  engine: "fish"              # fish = online (butuh offline_only: false); piper = offline
  gender: "male"
  voices:
    piper:
      male: "id_ID-news_tts-medium"
      female: "custom/jarvis_cewek.onnx"
    system:
      macos:   { male: null, female: "Damayanti" }
      windows: { male: "Microsoft Andika", female: null }
      linux:   { male: "id+m3", female: "id+f3" }
    edge:
      male: "id-ID-ArdiNeural"
      female: "id-ID-GadisNeural"
  length_scale: 1.0
  noise_scale: 0.667
  volume: 1.0
  max_spoken_chars: 400
  fish:                       # dipakai bila engine: "fish" (ONLINE, butuh offline_only: false)
    voice_id: "248cf6d6ff744c2ba09d379de5c118ae"          # pria: Toren
    female_voice_id: "6ef10a3839594c6bbf20704470c84086"   # wanita: Anindya
    api_key_file: "~/.jarvis-fish-key"

tools:
  enabled: ["system", "apps", "media", "web", "screen", "keyboard", "notes", "docs", "online", "smarthome", "workspace", "messaging", "agent", "island", "language"]
  confirm_risk_level: "high"
  confirm_timeout_s: 8
  apps:
    allowed: []               # kosong = semua app boleh; isi untuk membatasi
    aliases:
      "vs code": "Visual Studio Code"
      "browser": "Google Chrome"
      "musik": "Spotify"
      "kalkulator": "Calculator"
      "kalender": "Calendar"

memory:
  enabled: true
  save_conversations: true
  retention_days: 30

platform:
  linux:
    typing_backend: "auto"
    screenshot_backend: "auto"
    volume_backend: "auto"

ui:
  tray: true
  api:
    enabled: true            # dibutuhkan Isla Desk (Tanya AI, Setelan Jarvis); hanya 127.0.0.1

# Sambungan ke Isla Desk: batang suara (mendengar/berpikir/bicara) dan kartu izin di pulau.
island:
  enabled: true

# Agen kerja: Jarvis mengerjakan tugas bertahap di komputer (keputusan pemilik 2026-11-10: seluruh home).
# Tetap berlaku: konfirmasi tiap ubah file/perintah, blokir keras (sudo, hapus massal, ...), file
# rahasia dilindungi (workspace.deny), pemblokiran jaringan bila offline_only.
agent:
  enabled: true
  # Aksi yang MINTA IZIN (default: semua). Hapus item agar jalan otomatis tanpa tanya:
  #   ["run_command"]  → ubah/buat file otomatis, perintah shell tetap tanya
  #   []               → tidak pernah tanya (blokir keras & file rahasia tetap berlaku)
  confirm_actions: ["edit_file", "write_file", "run_command"]
workspace:
  folders: ["~"]
  # Keputusan pemilik 2026-11-13: agen boleh MEMERIKSA seluruh komputer. Tiap akses di luar folders
  # selalu minta izin; ubah/buat file tetap hanya di folders; rahasia (deny) tetap dilindungi.
  full_access: true
